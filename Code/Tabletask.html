<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <style>

        .header {
            background-color: #3498db;
            color: white;
            text-align: center;       
        }

        .d1 {
            background-color: white;
            width: 90%;
            margin: 30px auto;
            padding: 55px 30px 30px;
            box-shadow: 0 2px 10px #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        table {
            width: 100%;
        }

        th {
            background-color: #3498db;
            color: white;
            text-align: left;
            font-size: 22px;
        }

        td {
            
            border: 1px solid #ddd;
            font-size: 22px;
        }
        .footer {
            background-color: #3498db;
            color: white;
            text-align: center;
            padding: 18px;
            font-size: 21px;
        }
    </style>
</head>
<body>
     <body>

    <div class="header">
        <h1>Styled Table</h1>
        <p>Enjoy the beauty of a styled HTML table!</p>
    </div>


    <div class="d1">

        <table>

            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Occupation</th>
            </tr>

            <tr>
                <td>John Doe</td>
                <td>28</td>
                <td>Software Developer</td>
            </tr>

            <tr>
                <td>Jane Smith</td>
                <td>35</td>
                <td>Graphic Designer</td>
            </tr>

            <tr>
                <td>Robert Johnson</td>
                <td>42</td>
                <td>Teacher</td>
            </tr>

        </table>

    </div>

    <div class="footer">
        © 2026 Styled Table. All rights reserved.
    </div>
</body>
</html>
